name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SECRET_KEY: ci-only-not-a-secret

jobs:
  backend-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q -p no:warnings

  backend-postgres:
    name: Backend tests + migrations (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/migrations"
      TEST_DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/tests"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create the test database
        run: PGPASSWORD=ci psql -h localhost -U ci -d migrations -c "CREATE DATABASE tests;"
      - name: Migrations upgrade an empty database
        run: alembic upgrade head
      - name: Migrations match the models
        run: alembic check
      - name: Migrations downgrade and re-upgrade
        run: alembic downgrade base && alembic upgrade head
      - name: Tests on PostgreSQL
        run: python -m pytest tests/ -q -p no:warnings

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"  # CRA fails the build on lint warnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build
      - name: Translation strings list is up to date
        run: npm run i18n:extract && git diff --exit-code -- src/i18n/strings.json

  security:
    name: Security scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: >-
          semgrep scan --error --metrics off
          --config p/python --config p/fastapi --config p/javascript --config p/react
          --config p/secrets --config p/security-audit
          --config p/dockerfile --config p/docker-compose --config p/nginx
          --exclude frontend/node_modules
          .

  docker:
    name: Docker images + stack health
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: API health
        run: curl --fail --silent http://localhost:8000/health
      - name: Web serves the app and client routes
        run: |
          curl --fail --silent http://localhost:3000/ | grep -q '<div id="root">'
          curl --fail --silent http://localhost:3000/exam/some-id | grep -q '<div id="root">'
      - name: Web sends the security headers (CSP filled in with the API origin)
        run: |
          headers=$(curl --fail --silent --head http://localhost:3000/)
          echo "$headers" | grep -i "^content-security-policy:.*connect-src 'self' http://localhost:8000;"
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^x-frame-options: deny'
          # no inline scripts: the bundle is loaded with <script defer src=...>
          ! curl --fail --silent http://localhost:3000/ | grep -q '<script>'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
