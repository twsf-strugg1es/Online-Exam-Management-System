server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers live only here: any add_header inside a location would
    # replace all of these for that location. Caching uses `expires` instead.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # The image's template step fills in $API_ORIGIN (the API the app calls). Scripts come only
    # from this site (the build sets INLINE_RUNTIME_CHUNK=false); 'unsafe-inline' styles are for
    # React style attributes; data:/blob: images are image answers; YouTube is the promo video.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com; font-src 'self'; connect-src 'self' $API_ORIGIN; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Hashed build assets never change, so browsers can keep them for a year
    location /static/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes (e.g. /exam/123) all serve the app shell, revalidated on every load
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
