<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fairpaper · Logo explorations</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --paper: #F6F4EE; --sheet: #FDFCF9; --ink: #161614; --soft: #55524B; --rule: #E3DFD4; --g: #0B6E4F; --hall: #10201A; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.5 "Geist", system-ui, sans-serif; }
  .wrap { width: min(1200px, 100% - 2rem); margin: 0 auto; padding: 3rem 0 5rem; }
  h1 { font-size: 2.4rem; letter-spacing: -0.03em; margin: 0 0 0.4rem; font-weight: 600; }
  .intro { color: var(--soft); margin: 0 0 2.5rem; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.25rem; }
  .opt { background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; overflow: hidden; }
  .opt header { display: flex; justify-content: space-between; align-items: baseline; padding: 1rem 1.25rem 0; }
  .opt header b { font-weight: 600; }
  .opt header span { font: 500 0.72rem/1 "Geist Mono", monospace; color: var(--soft); letter-spacing: 0.06em; }
  .opt p { margin: 0.3rem 1.25rem 0; color: var(--soft); font-size: 0.9rem; }
  .hero { display: grid; place-items: center; height: 170px; }
  .hero svg { width: 96px; height: 96px; }
  .rows { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule); }
  .cell { display: flex; align-items: center; gap: 0.65rem; padding: 1rem 1.25rem; }
  .cell.dark { background: var(--hall); color: #EEF2EE; }
  .lockup { display: inline-flex; align-items: center; gap: 0.55rem; font-weight: 600; font-size: 1.15rem; letter-spacing: -0.02em; }
  .lockup svg { width: 30px; height: 30px; }
  .sizes { display: flex; align-items: center; gap: 0.9rem; padding: 0.85rem 1.25rem; border-top: 1px solid var(--rule); font: 500 0.72rem/1 "Geist Mono", monospace; color: var(--soft); }
  .sizes svg { flex: none; }
  .tab { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.6rem; background: #E9E6DE; border-radius: 8px 8px 0 0; color: var(--ink); font: 400 0.75rem/1 "Geist", sans-serif; }
  .tab svg { width: 16px; height: 16px; }
  .current { outline: 2px solid var(--g); outline-offset: -2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fairpaper logo explorations</h1>
  <p class="intro">Nine directions in the brand green. Each one is shown large, beside the name on light and dark, and at 32 and 16 px, where a favicon has to survive. Option 1 is the current mark, for comparison.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const G = '#0B6E4F';
// Every mark is drawn on a 32×32 grid. `fg` is the mark's light color on the green tile.
const marks = [
  { name: 'Bubble and check', tag: 'PREVIOUS', note: 'An answer bubble with a tick. Friendly and clear.', svg: (fg = '#fff') =>
    `<rect width="32" height="32" rx="8" fill="${G}"/><circle cx="16" cy="16" r="9.5" fill="${fg}"/><path d="M11.6 16.3l3.1 3.1 5.9-6.3" fill="none" stroke="${G}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>` },
  { name: 'Answer sheet row', tag: 'CHOSEN', note: 'Four bubbles, one marked. Reads as “exam” instantly.', svg: (fg = '#fff') =>
    `<rect width="32" height="32" rx="8" fill="${G}"/>${[6.5, 12.83, 19.17, 25.5].map((x, i) => i === 2 ? `<circle cx="${x}" cy="16" r="3.1" fill="${fg}"/>` : `<circle cx="${x}" cy="16" r="2.45" fill="none" stroke="${fg}" stroke-width="1.7"/>`).join('')}` },
  { name: 'Filled bubble', tag: 'MINIMAL', note: 'One answer bubble, pencilled in. The quietest option.', svg: (fg = '#fff') =>
    `<rect width="32" height="32" rx="8" fill="${G}"/><circle cx="16" cy="16" r="9" fill="none" stroke="${fg}" stroke-width="2.2"/><circle cx="16" cy="16" r="5" fill="${fg}"/>` },
  { name: 'T with a tick', tag: 'LETTER', note: 'The T’s stem ends in a check mark: the name and the result in one stroke.', svg: (fg = '#fff') =>
    `<rect width="32" height="32" rx="8" fill="${G}"/><path d="M9 9.5h14" stroke="${fg}" stroke-width="3" stroke-linecap="round"/><path d="M11.8 18.4l4.2 4.1V9.5" fill="none" stroke="${fg}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` },
  { name: 'TK monogram', tag: 'LETTER', note: 'Initials on the tile. Strong at small sizes, less story.', svg: (fg = '#fff') =>
    `<rect width="32" height="32" rx="8" fill="${G}"/><path d="M7.5 10h8M11.5 10v12.5" stroke="${fg}" stroke-width="2.6" stroke-linecap="round"/><path d="M18.5 10v12.5M24.5 10l-6 6.2 6 6.3" fill="none" stroke="${fg}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>` },
  { name: 'Paper with a tick', tag: 'OBJECT', note: 'An exam sheet with a folded corner and a tick. Literal, warm.', svg: (fg = '#fff') =>
    `<rect width="32" height="32" rx="8" fill="${G}"/><path d="M10 7.5h8.5l4.5 4.5v12.5H10z" fill="${fg}"/><path d="M18.5 7.5V12H23" fill="none" stroke="${G}" stroke-width="1.4" stroke-linejoin="round" opacity="0.5"/><path d="M12.8 17.6l2.4 2.4 4.6-4.9" fill="none" stroke="${G}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>` },
  { name: 'Shield and check', tag: 'INTEGRITY', note: 'Leads with fairness. Risks reading as security software.', svg: (fg = '#fff') =>
    `<rect width="32" height="32" rx="8" fill="${G}"/><path d="M16 6.8l8 3v6.1c0 4.9-3.4 8.4-8 9.6-4.6-1.2-8-4.7-8-9.6V9.8z" fill="${fg}"/><path d="M12.4 16.2l2.6 2.6 4.8-5.1" fill="none" stroke="${G}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>` },
  { name: 'Open bubble tick', tag: 'GESTURE', note: 'The tick breaks out of the bubble, like a confident pen mark.', svg: (fg = '#fff') =>
    `<rect width="32" height="32" rx="8" fill="${G}"/><path d="M22.6 11.2A8.5 8.5 0 1 0 24.5 16" fill="none" stroke="${fg}" stroke-width="2.4" stroke-linecap="round"/><path d="M11.8 15.6l3.6 3.6 9.8-10.2" fill="none" stroke="${fg}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>` },
  { name: 'Round seal', tag: 'NO TILE', note: 'A circle instead of the rounded square. Softer, more badge-like.', svg: (fg = '#fff') =>
    `<circle cx="16" cy="16" r="16" fill="${G}"/><circle cx="16" cy="16" r="11.5" fill="none" stroke="${fg}" stroke-width="1.2" opacity="0.45"/><path d="M11 16.4l3.4 3.4 6.8-7.2" fill="none" stroke="${fg}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>` },
];

const svg = (m, size) => `<svg viewBox="0 0 32 32" width="${size}" height="${size}" aria-hidden="true">${m.svg()}</svg>`;
document.getElementById('grid').innerHTML = marks.map((m, i) => `
  <article class="opt${i === 1 ? ' current' : ''}">
    <header><b>${i + 1}. ${m.name}</b><span>${m.tag}</span></header>
    <p>${m.note}</p>
    <div class="hero">${svg(m, 96)}</div>
    <div class="rows">
      <div class="cell"><span class="lockup">${svg(m, 30)}Fairpaper</span></div>
      <div class="cell dark"><span class="lockup">${svg(m, 30)}Fairpaper</span></div>
    </div>
    <div class="sizes">${svg(m, 32)}32 px ${svg(m, 16)}16 px <span class="tab">${svg(m, 16)}Fairpaper</span></div>
  </article>`).join('');
</script>
</body>
</html>
